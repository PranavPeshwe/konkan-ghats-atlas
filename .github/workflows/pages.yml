name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm.cmd ci --no-fund --no-audit
      - name: Run unit tests
        run: node --test --test-concurrency=2 tests/*.test.mjs
      - name: Verify source data
        run: npm.cmd run validate
      - name: Build the standalone app
        run: npm.cmd run build
      - name: Stage the published files
        run: |
          $site = Join-Path $env:RUNNER_TEMP 'konkan-ghats-atlas-pages'
          New-Item -ItemType Directory -Path $site -Force | Out-Null
          Copy-Item -LiteralPath 'pune_to_konkan.html' -Destination (Join-Path $site 'index.html')
          Copy-Item -LiteralPath 'pune_to_konkan.html' -Destination $site
          Copy-Item -LiteralPath 'DATA-LICENSE.txt','THIRD-PARTY-NOTICES.txt' -Destination $site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '${{ runner.temp }}\konkan-ghats-atlas-pages'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
